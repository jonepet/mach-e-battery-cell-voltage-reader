services:
  app:
    build: .
    ports:
      - "${MACHE_BIND_ADDRESS:-127.0.0.1}:${MACHE_PUBLISH_PORT:-8080}:8080"
    environment:
      MACHE_READ_INTERVAL_S: "${MACHE_READ_INTERVAL_S:-2.0}"
      MACHE_BAUDRATE: "${MACHE_BAUDRATE:-115200}"
      MACHE_SEPARATION_MS: "${MACHE_SEPARATION_MS:-5}"
      MACHE_FRAME_TIMEOUT_MS: "${MACHE_FRAME_TIMEOUT_MS:-200}"
      MACHE_ALLOWED_HOSTS: "${MACHE_ALLOWED_HOSTS:-}"
    volumes:
      - /dev:/dev
    # ttyUSB (188), ttyACM (166) and rfcomm (216) character devices, so an adapter attached after start is usable.
    device_cgroup_rules:
      - "c 188:* rmw"
      - "c 166:* rmw"
      - "c 216:* rmw"
    restart: unless-stopped

  checks:
    build: .
    profiles: [tools]
    volumes:
      - ./tests:/app/tests
      - ./tools:/app/tools
      - ./pyproject.toml:/app/pyproject.toml
    command: sh -c "ruff format --check src tests tools && ruff check src tests tools && mypy && pytest -q"

  frontend-checks:
    build:
      context: .
      target: frontend
    profiles: [tools]
    command: sh -c "npm run lint && npm run typecheck && npm test && npm run build"

  wheel:
    build: .
    profiles: [tools]
    volumes:
      - ./dist:/dist
    command: pip wheel --no-deps --wheel-dir /dist .

  screenshot:
    build:
      context: tools
      dockerfile: screenshot.Dockerfile
    profiles: [tools]
    network_mode: host
    environment:
      GUI_URL: "http://localhost:${MACHE_PUBLISH_PORT:-8080}/"
      SCREENSHOT_DIR: /screens
    volumes:
      - ./docs/images:/screens

  lock:
    image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
    profiles: [tools]
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      UV_CACHE_DIR: /tmp/uv
    working_dir: /src
    volumes:
      - .:/src
    command: >-
      uv pip compile pyproject.toml packaging/build-requirements.in
      --python-platform x86_64-pc-windows-msvc --python-version 3.14
      --generate-hashes --no-header -o packaging/requirements-windows.txt

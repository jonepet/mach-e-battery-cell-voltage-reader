<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mach-E Cell Voltages</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="toolbar">
    <h1>Mach-E Cell Voltages</h1>
    <form id="connection" class="toolbar__controls">
      <label for="port">Adapter port</label>
      <select id="port" name="port"></select>
      <button type="button" id="refresh">Refresh</button>
      <button type="submit" id="connect">Connect</button>
      <button type="button" id="disconnect">Disconnect</button>
    </form>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </header>

  <main>
    <section class="panel" aria-labelledby="vehicle-heading">
      <h2 id="vehicle-heading">Vehicle</h2>
      <div id="vehicle" class="tiles"></div>
    </section>

    <section class="panel" aria-labelledby="battery-heading">
      <h2 id="battery-heading">High-voltage battery</h2>
      <div id="battery" class="tiles"></div>
    </section>

    <section class="panel" aria-labelledby="temperature-heading">
      <h2 id="temperature-heading">Battery temperatures</h2>
      <div id="temperature" class="tiles"></div>
    </section>

    <section class="panel" id="cells-panel" aria-labelledby="cells-heading">
      <h2 id="cells-heading">Cell voltages</h2>
      <p id="cell-error" class="warning" hidden></p>
      <dl id="cell-stats" class="facts"></dl>
      <figure class="chart">
        <svg id="chart" role="img" aria-label="Deviation of each cell from the median voltage"></svg>
        <figcaption>Deviation of each cell from the median, in millivolts. Hover a bar for its value.</figcaption>
      </figure>
      <details>
        <summary>Show all cells as a table</summary>
        <table class="cell-table">
          <thead><tr><th scope="col">Cell</th><th scope="col">Voltage</th><th scope="col">From median</th></tr></thead>
          <tbody id="cell-table"></tbody>
        </table>
      </details>
    </section>

    <section class="panel" aria-labelledby="adapter-heading">
      <h2 id="adapter-heading">Adapter</h2>
      <dl id="adapter" class="facts"></dl>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>

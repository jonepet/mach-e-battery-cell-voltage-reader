[project]
name = "mache-cell-voltages"
version = "0.1.0"
description = "Research project: read every cell voltage and the health of a Ford Mustang Mach-E battery through an OBD adapter"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.15",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyserial>=3.5",
]

[project.scripts]
mache-cells = "mache_cells.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mache_cells = ["web/**/*"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET", "PL", "RUF"]
ignore = ["PLR0913", "PLR2004"]

[tool.mypy]
strict = true
packages = ["mache_cells"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
